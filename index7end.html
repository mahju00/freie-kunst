<!DOCTYPE html>

<html lang="de">

<head>

    <meta charset="UTF-8">

    <title>Freie Kunst</title>

    <meta name="description"
          content="Entdecke meine Kunstwelt mit Gemälden, Zeichnungen und kreativen Kunstwerken.">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <style>

        /* ------------------------------
           صفحه اصلی
        ------------------------------ */

        body {
            margin: 0;
            min-height: 100vh;

            background-image: url('malen.jpg');
            background-repeat: no-repeat;
            background-position: top center;
            background-size: 100% auto;
            background-color: #000;

            padding-top: 70px;
        }


        /* ------------------------------
           منوی بالای سایت
        ------------------------------ */

        nav {
            background-color: #413535;

            padding: 5px;

            width: 100%;

            position: fixed;
            top: 0;
            left: 0;

            z-index: 1000;
        }

        nav ul {
            list-style: none;

            margin: 0;
            padding: 0;

            text-align: center;
        }

        nav li {
            display: inline;
        }

        nav a {
            color: white;

            text-decoration: none;

            margin: 0 25px;

            font-size: 16px;
        }


        /* ------------------------------
           عنوان اصلی
        ------------------------------ */

        h1 {
            color: #413535;

            font-size: 40px;

            margin-left: 30px;

            line-height: 1.4;
        }


        /* ------------------------------
           دکمه‌ها
        ------------------------------ */

        .buttons {
            text-align: center;

            margin-top: 30px;
        }

        .login-button {
            color: #934c04;

            font-size: 32px;

            background-color: hsl(242, 36%, 42%);

            border-radius: 8px;

            padding: 10px 40px;

            border: none;

            cursor: pointer;
        }

        .register-button {
            color: hsl(289, 35%, 39%);

            font-size: 32px;

            background-color: hwb(52 15% 20%);

            border-radius: 8px;

            padding: 10px 20px;

            border: none;

            cursor: pointer;

            margin-left: 20px;
        }


        /* ------------------------------
           تنظیم برای موبایل
        ------------------------------ */

        @media (max-width: 600px) {

            body {
                padding-top: 100px;

                background-size: auto 100vh;

                background-position: top center;
            }


            nav {
                padding: 8px 0;
            }

            nav ul {
                display: flex;

                justify-content: center;

                align-items: center;

                flex-wrap: wrap;

                gap: 8px;
            }

            nav li {
                display: block;
            }

            nav a {
                margin: 0 5px;

                font-size: 12px;
            }


            h1 {
                font-size: 26px;

                text-align: center;

                margin: 30px 10px;

                line-height: 1.5;
            }


            .buttons {
                display: flex;

                flex-direction: column;

                align-items: center;

                gap: 15px;
            }

            .login-button,
            .register-button {
                font-size: 22px;

                padding: 10px 25px;

                margin: 0;
            }

        }

    </style>

</head>


<body>

    <!-- منوی سایت -->

    <header>

        <nav>

            <ul>

                <li>
                    <a href="login.html">HUSE</a>
                </li>

                <li>
                    <a href="blog.html">ÜBER MEINE GEMÄLDE</a>
                </li>

                <li>
                    <a href="kunstwerk.html">KUNSTWERK</a>
                </li>

                <li>
                    <a href="Meinekunstwrke.html">MEINE KUNSTWERKE</a>
                </li>

            </ul>

        </nav>

    </header>


    <!-- محتوای اصلی -->

    <main>

        <h1>

            WILLKOMMEN IN MEINER WELT
            <br>

            WO GEFÜHLE ZU KUNST WERDEN

        </h1>


        <!-- دکمه‌ها -->

        <div class="buttons">

            <input
                type="button"
                value="Login"
                class="login-button"
                onclick="window.location.href='login.html'"
            >


            <input
                type="button"
                value="Registrieren"
                class="register-button"
                onclick="alert('Danke für die Registrierung!')"
            >

        </div>

    </main>

</body>

</html>
